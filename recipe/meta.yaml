{% set name = "langchain-postgres" %}
{% set version = "0.0.17" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/langchain_postgres-{{ version }}.tar.gz
  sha256: 8d0d4f8223f3d74471abd640e4173316f9874f28f417d674cc8b0b50ee735c09

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - poetry-core
    - pip
  run:
    - python >={{ python_min }}
    - asyncpg >=0.30.0
    - langchain-core >=0.2.13,<0.4.0
    - pgvector-python >=0.2.5,<0.4
    - psycopg >=3,<4
    - psycopg-pool >=3.2.1,<4
    - sqlalchemy >=2,<3
    - numpy >=1.21,<3

test:
  imports:
    - langchain_postgres
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/langchain-ai/langchain-postgres
  summary: An integration package connecting Postgres and LangChain
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mediocretech
